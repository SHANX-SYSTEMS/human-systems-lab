name: Publish v0.1.0

on:
  push:
    branches: ["main"]
    paths:
      - "RELEASE_TRIGGER_v0.1.0"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release target
        uses: actions/checkout@v4
        with:
          ref: c614fda4f904078dc67a9a816312e168d89c1b30
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists"
            exit 0
          fi
          gh release create v0.1.0 \
            --target c614fda4f904078dc67a9a816312e168d89c1b30 \
            --title "v0.1.0 — Open-source foundation" \
            --notes-file RELEASE_NOTES_v0.1.0.md
